services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SSE_URL: ${VITE_SSE_URL:-http://localhost:3000}
    ports:
      - "80:80"
    restart: unless-stopped

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
      - VITE_SSE_URL=${VITE_SSE_URL:-http://localhost:3000}
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - dev
